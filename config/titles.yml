# Which job titles the engine keeps.
# A title must (1) look like an internship, (2) match a track, (3) contain no excluded term.
# Keywords are matched as whole words, case-insensitive. Edit freely; no code changes needed.

tracks:
  - name: Trading
    priority: 1
    location_rule: season        # season rule from Feature 4
    keywords: [trading, trader, "sales & trading", "sales and trading", markets, "market making"]
  - name: Quant / derivatives
    priority: 1
    location_rule: season
    keywords: [quantitative, quant, derivatives, volatility, options, futures, "market risk", "portfolio risk"]
  - name: Buy-side investing
    priority: 2
    location_rule: season
    keywords: ["investment analyst", investments, investment, "portfolio management", "asset management",
               "investment research", "equity research", "research analyst", "family office",
               "hedge fund", "credit analyst", "fixed income", "equity analyst", "sector analyst",
               "macro analyst", "fundamental research", "fundamental researcher", economist,
               "economic research"]
  - name: Data analytics
    priority: 2
    location_rule: season        # anywhere in the US in Summer, near campus otherwise
    keywords: ["data analyst", "data analytics", "data science", "business intelligence", analytics]
  - name: Software engineering
    priority: 3
    location_rule: season
    keywords: ["software engineer", "software engineering", "software developer", "python developer",
               "quant developer", "quantitative developer"]
  - name: Wealth management
    priority: 3
    location_rule: season
    keywords: ["wealth management", "private wealth", "private bank", "private banking"]

# Titles like "Summer Analyst" with no division: kept for the scorer to judge from the description.
# "Finance Intern" and "Financial Analyst Intern" are left out: they are corporate finance
# (FP&A) roles, which don't lead to quant trading (Amir, Nov 12).
ambiguous_keywords: ["summer analyst", "summer associate", "investment intern"]
# ...unless the title names a non-finance division.
ambiguous_exclude: [technology, operations, engineering, software, developer, it, compliance, legal,
                    sales, hr, supply chain, procurement, marketing, business development]

# Any of these anywhere in the title drops the role.
exclude:
  - investment banking
  - "m&a"
  - mergers
  - leveraged finance
  - coverage
  - ecm
  - dcm
  - audit
  - tax
  - accounting
  - insurance sales
  - marketing
  - recruiting
  - human resources
  - phd
  - "master's"
  - masters
  - mba
  - students only # programs for one school, e.g. "(MIT Students Only)"
  - talk          # events listed as roles
  - webinar
  - info session
  - information session
  - operations    # ops and sales internships aren't wanted (Amir, Nov 11)
  - sales
  - corporate finance    # corporate finance / FP&A roles aren't wanted (Amir, Nov 12)
  - fp&a
  - financial planning
  - corporate development
  - digital image  # "Digital Image Asset Management" is media archiving, not investing

# A title counts as an internship if it contains one of these.
internship_keywords: [intern, internship, "summer analyst", "summer associate", co-op, coop,
                      off-cycle, "insight program", "insight programme", placement]

# Reassign already matched titles to the target track and its location rule.
reassign:
  - to: Software engineering
    when_any: [developer, "software engineer", "systems engineer"]
    unless_any: [research, researcher, trader]

# Graduate-student-only phrases in titles or normalized URLs.
graduate_only: ["graduate intern", "summer associate"]   # Summer Associate = MBA-level

# Phrases that keep a title despite an exclude term inside them.
exclude_except: ["sales and trading", "sales & trading", "operations research"]
